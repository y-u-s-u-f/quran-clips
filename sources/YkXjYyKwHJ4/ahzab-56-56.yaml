# source: https://www.youtube.com/watch?v=YkXjYyKwHJ4
# Surah al-Ahzab 56 -- Badr al-Turki, al-Masjid al-Haram, rak'ah 3 of the
# Thursday prayer (abs ~15:27-15:57 of the source). Fetch with
# `--client web_embedded`: the default ladder lands at 640x360 here.
style: horizontal
signature: null                 # the reference reel carries no handle or mark

surah: 33
ayah_start: 56
ayah_end: 56
# Never on screen -- the reciter's name goes into the mp4's tags, and
# pipeline/publish.py builds the post's caption and hashtag from them.
reciter: "بدر التركي"

# Onset (envelope) at abs 927.45; starting 0.13s earlier gives the hook a
# frame of air. The end sits 0.5s after "tasliman" decays, inside the deep
# true-silence gap 956.8-958.4, so no next-verse speech leaks into the tail.
trim: [927.32, 957.30]

# The shot is a fixed single camera: reciter centred (head ~x1000), a burned-in
# top-right logo (x>=1620), a full-width bottom banner (y>=800) and a police
# attendee down the right edge (~x1560+). This 1280x720 window (a 1.5x zoom)
# moves him RIGHT and drops every one of them: right edge 1358 < 1560, bottom
# 750 < 800. Hand-set: crop.py's solve ({x: 14, y: 58, w: 1344, h: 756},
# x_offset -357) puts his crown on the window's top edge.
crop: {x: 78, y: 30, w: 1280, h: 720}

# Text LEFT, opposite the reciter. His outer robe edge lands at ~0.95 W, so a
# block centred on 0.31 W leaves equal outer margins: 0.31 * 1920 = 595 px,
# i.e. 595 - 960 = -365 from centre.
x_offset: -365

# IBTIDA' RESTART: after "...aamanu sallu 'alayhi" the reciter pauses and
# starts the whole phrase again before completing it. Card 2 carries the
# phrase and its completion and stays up across both utterances.
groups:
  - n_words: 6
    english: "Indeed, Allah confers blessing upon the Prophet, and His angels ask Him to do so."
  - n_words: 7
    english: "O you who have believed, ask blessing upon him and ask Allah to grant him peace."
