# Al-Ahqaf 46:15 (opening clause), Ilyas Hajri -- horizontal default reel.
# The clip recites only the first 13 of the ayah's 45 words; the unrecited
# 32-word tail is parked in a final group and suppressed (its interpolated
# window lands after the recitation ends).
style: default
signature: "TilawatQuraniyyah"
orientation: horizontal

surah: 46
ayah_start: 15
ayah_end: 15

groups:
  - n_words: 4
    english: "And We have enjoined upon man, to his parents, good treatment."
  - n_words: 5
    english: "His mother carried him with hardship and gave birth to him with hardship,"
  - n_words: 4
    english: "and his gestation and weaning [period] is thirty months."
  - n_words: 32
    english: ""

suppress: [[21.5, 23.3]]
nudge:
  - {group: 2, end: 1.8}
