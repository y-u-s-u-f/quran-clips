source_url: "https://www.youtube.com/watch?v=1ULr9AWecM8"
reciter:
  name_en: "Abdulaziz al-Turki"
  name_ar: "عبدالعزيز التركي"
  photo: assets/reciters/abdulaziz-al-turki.jpg
# Static scene image IS the clip's video track (reciter seated RIGHT, empty
# wall upper-LEFT). Source footage is used for audio only.
scene_image: assets/reciters/abdulaziz-al-turki-scene.png
# Reframe crop of the 1280x720 still (1.6x zoom, exact 16:9) -> Lanczos to
# 1920x1080 (+mild unsharp). Puts the reciter's face BIGGER at ~x0.73/y0.43
# (user annotation circle); crops away the still's bottom name-caption and
# top-right watermark.
scene_crop:
  x: 251
  y: 6
  w: 800
  h: 450
# Text block placement (frame fractions). Reciter is RIGHT, text on the LEFT,
# vertically CENTERED (user annotation 1); legibility over the darker mushaf-
# stand region comes from the text-backing gradient + drop shadow.
text:
  center_x_frac: 0.30
  center_y_frac: 0.46   # Arabic centre; whole Arabic+English BLOCK centres ~0.50

segment:
  start: "00:06:22.800"   # absolute in source
  end: "00:06:44.000"     # absolute in source; source duration 404.194s
surah: 9
ayah_range: [51, 51]
phrases:   # times RELATIVE to clip start (t0=00:06:22.800), seconds
  - t0: 0.60
    t1: 9.88
    ayah: 51
    ar: "قُل لَّن يُصِيبَنَا إِلَّا مَا كَتَبَ اللَّهُ لَنَا هُوَ مَوْلَىٰنَا"
    en: "Say, “Never will we be struck except by what Allah has decreed for us; He is our protector.”"
  - t0: 10.24
    t1: 20.90
    ayah: 51
    ar: "هُوَ مَوْلَىٰنَا وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ"
    en: "He is our protector. And upon Allah let the believers rely."
