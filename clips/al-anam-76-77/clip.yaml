# Live-video background: Taraweeh at al-Masjid al-Haram (night 10, Ramadan 1442).
# Single static camera the whole video; reciter stands CENTERED-RIGHT at a gold
# mic stand, facing screen-LEFT. USER RULE: captions on the side he FACES -> LEFT.
# Crop 1440x810 @ (0,0): drops BOTH top-right burned-in logos (source x>=1450)
# and the intermittent bottom lower-third banner (its top edge ~y830 > crop
# bottom 810) and the gold-robed attendant at far right (x>=1560). Reciter output
# fractions (measured on drawgrid frames): robe-left 0.417 at bottom / chest-left
# ~0.52 at caption height, right edge ~0.965, face 0.59-0.73, head top ~0.105.
# Balanced-margin formula NOT satisfiable here (reciter ~0.55 of output width;
# only ~530 source px right of him), so framing mirrors account ref DZcVeORugrZ:
# reciter right, caption centre x~0.30 in the left gap. Thin gold mic arms cross
# the Arabic band at x~0.26-0.34 (blurred-ish, same class as ref DXLVk82Eqyj's
# gold mics; text_backing_gradient + shadow carry legibility).
video_bg:
  mode: live
  crop:
    x: 0
    y: 0
    w: 1440
    h: 810
text:
